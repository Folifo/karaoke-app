name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/openapi.yaml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/openapi.yaml"
      - ".github/workflows/backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Tests unitaires + tests d'intégration (Testcontainers utilise le Docker du runner).
      - name: Build et tests
        run: ./mvnw -B verify
